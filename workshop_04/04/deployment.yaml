apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web-deployment
  labels:
    app: nginx-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        # 1. สั่ง Mount แผ่นดิสก์จำลองเข้ากับพาธในตู้คอนเทนเนอร์
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      # 2. นิยามแผ่นดิสก์จำลอง (Volume) โดยดึงข้อมูลมาจาก ConfigMap
      volumes:
      - name: html-volume
        configmap:
          name: nginx-html-config